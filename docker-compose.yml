version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healrag-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./evidence:/app/evidence
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healrag-dashboard
    command: ["python", "dashboard/app.py"]
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./evidence:/app/evidence
    depends_on:
      - api
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: healrag-frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped
